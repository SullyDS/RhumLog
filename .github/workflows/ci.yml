name: RhumLog CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 · compile · tests · public snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py rhumlog scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Public demo smoke test
        run: python scripts/smoke_public_demo.py

      - name: Release contract
        run: python scripts/release_check.py
