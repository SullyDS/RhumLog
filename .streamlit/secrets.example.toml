# Example only — never commit real credentials in secrets.toml.
# Copy to .streamlit/secrets.toml for a private/persistent deployment with OIDC.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "replace-with-provider-client-id"
client_secret = "replace-with-provider-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
